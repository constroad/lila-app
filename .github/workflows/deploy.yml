# Dispara el deploy. NADA MÁS — y eso es deliberado.
#
# POR QUÉ NO CORRE TESTS NI BUILD ACÁ (decisión del 14/08/2026, con números):
#
#   · El build era REDUNDANTE. Si el código no compila, la mini también falla al
#     compilar y `current` no se mueve: producción ni se entera. Compilar dos
#     veces, tirar una, y encima dejar que la copia desechable bloquee el deploy
#     es al revés de como debería ser.
#
#   · Los tests son MÁS BARATOS Y MÁS FIELES en la mini. Los 630 de lila tardan
#     21 s allá; acá GitHub tardaba 9+ minutos SÓLO en `npm ci` —dependencias
#     pesadas, runner frío— y encima corría en un entorno que no es ni el de
#     desarrollo ni el de producción, sin las envs.
#
#   · Y bloqueaba de verdad: con `needs: verificar`, cualquier hipo de la CI
#     dejaba a producción sin poder deployar. Pasó.
#
# El portón de calidad vive ahora en `deploy.sh`: instala, **corre los tests**,
# y si fallan la release no se activa. Ver el bloque "PORTÓN DE TESTS" ahí.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lila
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Firmar y disparar el deploy
        env:
          SECRETO: ${{ secrets.TORRE_HMAC }}
          TORRE_URL: ${{ vars.TORRE_URL || 'https://torre.constroad.com' }}
        run: |
          set -euo pipefail
          [ -n "${SECRETO:-}" ] || { echo "::error::Falta TORRE_HMAC"; exit 1; }
          BODY="{\"app\":\"lila\",\"sha\":\"${GITHUB_SHA}\"}"
          TS=$(date +%s000)
          FIRMA=$(printf '%s' "${TS}.${BODY}" | openssl dgst -sha256 -hmac "$SECRETO" -r | cut -d' ' -f1)
          CODIGO=$(curl -sS -o /tmp/r.txt -w '%{http_code}' --max-time 30 \
            -X POST "${TORRE_URL}/api/hooks/deploy" \
            -H 'Content-Type: application/json' \
            -H "x-torre-timestamp: ${TS}" -H "x-torre-signature: ${FIRMA}" \
            --data-raw "$BODY")
          echo "Torre respondió ${CODIGO}: $(cat /tmp/r.txt)"
          case "$CODIGO" in
            202) echo "::notice::Deploy encolado — los tests y el build corren en la mini" ;;
            409) echo "::warning::Ya había un deploy en curso" ;;
            *)   echo "::error::Torre rechazó el disparo"; exit 1 ;;
          esac
