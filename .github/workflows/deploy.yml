# Dos trabajos INDEPENDIENTES, y esa independencia es la decisión de fondo.
#
# LOS TESTS CORREN ACÁ y no en la mini. Estuvieron un rato allá con el argumento
# de que tardaban 21 s contra los 9 min de GitHub, y el argumento medía lo que no
# era: esos segundos se le roban a una máquina de 8 GB que al mismo tiempo sirve a
# los usuarios. En el deploy real tardaron 366 s bajo contención, y Portal quedó
# tan lento que la gente lo reportó. Compute ajeno es gratis; el de producción no.
#
# PERO NO BLOQUEAN EL DEPLOY (`desplegar` no lleva `needs`), y esto es a
# conciencia. Ya pasó que un exit code espurio de jest —con los 6.580 tests en
# verde— dejara a producción sin poder deployar. Contra eso, lo que de verdad
# protege es lo que corre en la mini: si el build falla, `current` no se mueve; y
# si la app no responde al reiniciar, hay auto-rollback. Un test rojo se ve acá y
# se arregla; una CI trabada te deja sin poder desplegar un hotfix.
#
# La primera línea de defensa sigue siendo la regla de CLAUDE.md: los tests pasan
# localmente ANTES de commitear.
name: Deploy

on:
  push:
    branches: [main]
    # NO DISPARA POR DOCUMENTACIÓN. Medido el 16/08/2026: un commit que tocaba
    # solo dos `.md` costó **986 s de compilación** en Portal y produjo un bundle
    # idéntico al anterior, porque no cambió un solo `.ts`.
    #
    # Acá duele más que en un CI normal: el build no corre en un runner ajeno,
    # corre en la MISMA máquina de 8 GB que atiende WhatsApp, Portal y el
    # storage, y el de Portal pide 4 GB de heap. Y peor que el gasto: ocupa el
    # candado global de build, así que retrasa los deploys que sí importan — ese
    # mismo día dejó el deploy de torre esperando turno.
    #
    # VERIFICADO ANTES DE PONERLO: ningún `.md` se importa ni se lee en runtime
    # en los tres repos (0 imports), y las plantillas de lila son `.hbs`, `.pdf`
    # y `.png`. Si alguna vez un `.md` pasa a ser leído por el código —un
    # changelog que se renderiza, una plantilla— HAY QUE SACAR ESTA REGLA: el
    # síntoma sería «cambié el archivo y no pasa nada».
    #
    # Un commit que toca un `.md` Y un `.ts` SÍ deploya: `paths-ignore` solo
    # omite el run cuando TODOS los archivos del push encajan.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'specs/**'
      - '.claude/**'
      - '.agents/**'
  workflow_dispatch:

# ⚠️ ACÁ NO VA `concurrency`, Y ESA AUSENCIA ES EL ARREGLO DE UN INCIDENTE.
#
# Estaba a nivel de workflow (`group: deploy-lila`), y a ese nivel el candado lo
# toma EL RUN ENTERO — los dos jobs, tests incluidos. El 14/08/2026 un run se
# quedó trabado en `tests` hasta el techo de GitHub (6 h exactas: empezó 21:07 y
# el siguiente arrancó 03:07). Mientras tanto los pushes de 21:27, 21:29 y 21:48
# quedaron pendientes y GitHub los fue cancelando —solo sobrevive el más
# reciente— y el de 22:39 se desplegó recién a las 3 de la mañana.
#
# O sea: la CI que "no bloquea el deploy" lo bloqueó igual, por la puerta de
# atrás. La independencia entre jobs no vale nada si comparten el candado.
#
# Ahora el `concurrency` vive DENTRO de `desplegar` —que es lo único que hay que
# serializar, porque dos deploys de la misma app se pisan el symlink— y `tests`
# corre libre. Y tiene techo propio, así que un cuelgue dura 15 min, no 6 h.

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: deploy-lila
      cancel-in-progress: false
    steps:
      - name: Firmar y disparar el deploy
        env:
          SECRETO: ${{ secrets.TORRE_HMAC }}
          TORRE_URL: ${{ vars.TORRE_URL || 'https://torre.constroad.com' }}
        run: |
          set -euo pipefail
          [ -n "${SECRETO:-}" ] || { echo "::error::Falta TORRE_HMAC"; exit 1; }
          BODY="{\"app\":\"lila\",\"sha\":\"${GITHUB_SHA}\"}"
          TS=$(date +%s000)
          FIRMA=$(printf '%s' "${TS}.${BODY}" | openssl dgst -sha256 -hmac "$SECRETO" -r | cut -d' ' -f1)
          CODIGO=$(curl -sS -o /tmp/r.txt -w '%{http_code}' --max-time 30 \
            -X POST "${TORRE_URL}/api/hooks/deploy" \
            -H 'Content-Type: application/json' \
            -H "x-torre-timestamp: ${TS}" -H "x-torre-signature: ${FIRMA}" \
            --data-raw "$BODY")
          echo "Torre respondió ${CODIGO}: $(cat /tmp/r.txt)"
          case "$CODIGO" in
            202) echo "::notice::Deploy encolado en la mini" ;;
            409) echo "::warning::Ya había un deploy en curso" ;;
            *)   echo "::error::Torre rechazó el disparo"; exit 1 ;;
          esac

      # El aviso de que el disparo NO salió. Sin esto, un TORRE_HMAC rotado o el
      # túnel caído se traducen en "mi commit no aparece" y nada más: el deploy
      # nunca llegó a empezar, así que la mini tampoco tiene nada que avisar.
      - name: Avisar si el disparo falló
        if: failure()
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_DEPLOY_CHAT_ID || secrets.TELEGRAM_ALERTS_CHAT_ID }}
        run: |
          set -uo pipefail
          [ -n "${TOKEN:-}" ] && [ -n "${CHAT:-}" ] || exit 0
          # EL TEXTO SE ARMA CON `printf`, no como cadena de varias líneas: dentro
          # de un bloque `run: |` toda línea tiene que ir indentada, y esa
          # indentación se colaría en el mensaje. Escrito así, el YAML queda
          # válido y el mensaje sale sin espacios de más.
          TEXTO=$(printf '%s\n' \
            "🔌 <b>lila</b> · no se pudo disparar el deploy" \
            "<code>${GITHUB_SHA:0:7}</code>" \
            "<i>Torre no respondió 202 — el commit NO llegó a desplegarse</i>" \
            "<a href=\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">ver el run</a>")
          curl -s --max-time 10 -o /dev/null \
            "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXTO}"

  tests:
    runs-on: ubuntu-latest
    # Techo propio. El default de GitHub son 360 minutos, y ese default fue el que
    # convirtió un jest colgado en un deploy de madrugada.
    timeout-minutes: 15
    env:
      # NO BAJAR CHROMIUM ACÁ.
      #
      # `puppeteer@21` se trae un Chromium entero en su postinstall —unos 170 MB—
      # y la caché de `setup-node` no lo cubre: vive en `~/.cache/puppeteer`, no en
      # la de npm. Medido: `npm ci` imprimía su última línea a los 9 s y después se
      # quedaba MUDO 15 minutos hasta que el techo lo mataba. Tres runs seguidos.
      #
      # Ningún test lo necesita: no hay un solo `.test.ts` que importe puppeteer ni
      # que llame a `launch()`. En producción sí hace falta —los PDF salen de ahí—
      # así que esto va sólo en el job de tests, nunca en el `.npmrc` del repo.
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `--foreground-scripts`: si algún postinstall vuelve a colgarse, el log dice
      # CUÁL. Sin esto npm se queda callado y el diagnóstico es adivinanza.
      # El techo por paso hace que falle en 6 min con el nombre del paso a la vista,
      # en vez de comerse los 15 del job y aparecer como "cancelled".
      - name: Instalar dependencias
        timeout-minutes: 6
        run: npm ci --no-audit --no-fund --foreground-scripts

      # LOS BINARIOS NATIVOS PARA LINUX, QUE EL LOCKFILE NO TIENE.
      #
      # Los paquetes con parte nativa publican un binario por plataforma como
      # dependencia OPCIONAL, y npm graba en el lockfile sólo el de la máquina
      # donde se instaló. Este lockfile nació en una Mac ARM, así que adentro hay
      # `@img/sharp-darwin-arm64` y `@napi-rs/canvas-darwin-arm64` y nada más.
      # `npm ci` instala exactamente lo que dice el lockfile —esa es su virtud y
      # acá su trampa—, y en un runner linux-x64 el binario simplemente no está.
      #
      # EL SÍNTOMA ENGAÑA, y es lo que hace que valga la pena este comentario:
      # jest reportó "5 failed, 47 passed" y parecía que había tests rotos. No
      # había ninguno: 396 de 396 en verde. Lo que fallaba es que cinco SUITES no
      # llegaban ni a arrancar porque el `import` reventaba. Cinco correos de
      # "Run failed" describiendo un problema que no existe en el código.
      #
      # `--no-save`: el lockfile no se toca. Cambiarlo obligaría a la mini a
      # reinstalar el árbol entero por binarios que allá no se usan.
      #
      # Si mañana entra otro paquete nativo, el síntoma va a ser el mismo
      # ("Cannot find native binding" / "Could not load … using the linux-x64
      # runtime") y la respuesta es agregarlo a esta línea.
      - name: Binarios nativos para linux-x64
        run: npm install --no-save --os=linux --cpu=x64 --include=optional sharp @napi-rs/canvas

      # NODE_ENV=test: varios guards fail-closed de seguridad lanzan excepción si
      #   se creen en producción sin los secretos cargados.
      # --maxWorkers=2: el runner tiene 4 núcleos y jest por defecto levanta
      #   ncpu-1 workers; con happy-dom eso los mata y jest sale 1 aunque los
      #   tests pasen. Medido: local (8 núcleos) pasa en 28 s con exit 0; el
      #   mismo comando en el runner fallaba a los 2m10s.
      # --forceExit: happy-dom deja handles abiertos (los "Cannot log after tests
      #   are done"). Sin esto jest se cuelga al final y sale 1 con TODO en verde,
      #   que fue exactamente lo que bloqueó deploys de producción.
      - run: npm test -- --ci --maxWorkers=2 --forceExit
        env:
          NODE_ENV: test

      # AVISO DE TESTS ROJOS.
      #
      # Hace falta justamente PORQUE los tests no bloquean el deploy: el commit
      # ya está en producción y la pestaña de Actions no la mira nadie. Sin este
      # mensaje, "verde en la mini" y "roto en CI" conviven en silencio.
      #
      # `if: always()` y no `failure()`: un job que se pasa del techo se CANCELA,
      # y `failure()` no cubre ese caso — que es el que originó todo esto.
      - name: Avisar a Telegram
        if: always()
        env:
          ESTADO: ${{ job.status }}
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_DEPLOY_CHAT_ID || secrets.TELEGRAM_ALERTS_CHAT_ID }}
        run: |
          set -uo pipefail
          [ "$ESTADO" = "success" ] && exit 0
          [ -n "${TOKEN:-}" ] && [ -n "${CHAT:-}" ] || {
            echo "::warning::Sin TELEGRAM_BOT_TOKEN/TELEGRAM_ALERTS_CHAT_ID en los secrets del repo — no aviso"
            exit 0
          }
          esc() { printf '%s' "${1:-}" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'; }
          ASUNTO=$(git log -1 --format=%s 2>/dev/null | cut -c1-80)
          if [ "$ESTADO" = "cancelled" ]; then
            ICONO="⏱️"; QUE="los tests se cancelaron (¿techo de 15 min?)"
          else
            ICONO="❌"; QUE="los tests fallaron en CI"
          fi
          TEXTO=$(printf '%s\n' \
            "${ICONO} <b>lila</b> · ${QUE}" \
            "<code>${GITHUB_SHA:0:7}</code> $(esc "$ASUNTO")" \
            "<i>$(esc "$GITHUB_ACTOR")</i>" \
            "<a href=\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\">ver el run</a>" \
            "<i>el deploy siguió igual — producción YA tiene este commit</i>")
          curl -s --max-time 10 -o /tmp/tg.json \
            "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=${TEXTO}"
          grep -q '"ok":true' /tmp/tg.json || echo "::warning::Telegram rechazó el aviso: $(cat /tmp/tg.json)"
